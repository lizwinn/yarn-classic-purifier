# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on x86_64-linux and aarch64-linux: the
# fixture builds in the Nix sandbox, the real-world project, the lockfile
# reader checks and the formatting check.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L
      # The lock command needs the Nix store to prefetch, so the relock of
      # tests/fixtures/remote runs here rather than in a check. The new
      # lockfile has to match the committed one byte for byte.
      - name: relock
        run: |
          cp -r tests/fixtures/remote "$RUNNER_TEMP/remote"
          chmod -R u+w "$RUNNER_TEMP/remote"
          rm "$RUNNER_TEMP/remote/yarn-classic-purifier.lock.json"
          (cd "$RUNNER_TEMP/remote" && nix run "$GITHUB_WORKSPACE#yarn-classic-purifier" -- lock)
          cmp tests/fixtures/remote/yarn-classic-purifier.lock.json "$RUNNER_TEMP/remote/yarn-classic-purifier.lock.json"
